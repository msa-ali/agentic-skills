name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint skills (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test lint rules
        run: npm test
      - name: Validate skills and manifests
        run: npm run validate

  plugin:
    name: Validate and install plugin
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin manifests
        run: claude plugin validate .
      - name: Install from local marketplace
        run: |
          claude plugin marketplace add ./
          claude plugin install agentic-skills@msa-ali-skills --scope user
